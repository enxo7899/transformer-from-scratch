[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-gpt"
version = "1.0.0"
description = "A small decoder-only transformer written from scratch in numpy, with hand-written backpropagation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EmSoft" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
